[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpso-backend-core"
version = "0.1.0"
description = "CloudPSO Voice Agent — backend-core: WebRTC gateway, WebSocket management, barge-in (Phase 2)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "websockets>=12.0,<14.0",
    "grpcio>=1.62,<2.0",
    "grpcio-tools>=1.62,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    # Phase 2 media stack (mirrors requirements.txt).
    "aiortc>=1.9,<2.0",
    "av>=12.0,<14.0",
    "onnxruntime>=1.17,<2.0",
    "numpy>=1.26,<3.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
