name: CI

# Install -> lint -> test -> validate deployment assets -> build images.
#
# Every command here is one that has been run by hand on this repository; the
# suites are the real ones (backend-core 47, ai-engine 182, frontend 41,
# mlops 9, infra 5). Nothing is a placeholder.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-core:
    name: backend-core (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend-core/requirements.txt
      - name: Install
        working-directory: backend-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Lint (ruff)
        working-directory: backend-core
        run: python -m ruff check app tests
      - name: Test
        working-directory: backend-core
        # addopts is cleared so the service's own -q does not swallow the
        # summary a CI reader wants.
        run: python -m pytest -o addopts="" -p no:warnings

  ai-engine:
    name: ai-engine (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - name: Install (CPU-only torch)
        working-directory: ai-engine
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the CUDA build is multi-GB and pointless on a runner.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch model weights
        working-directory: ai-engine
        # STT + TTS only (~230 MB). The LLM is not a downloaded weight: it is
        # served by Ollama, which is absent on the runner, so the live Ollama
        # test skips cleanly. The unit suite drives a deterministic FakeLLM, so
        # nothing in the default run needs the model either.
        run: ./scripts/fetch_models.sh
      - name: Lint (ruff)
        working-directory: ai-engine
        run: python -m ruff check app tests
      - name: Test
        working-directory: ai-engine
        run: python -m pytest -o addopts="" -p no:warnings

  frontend:
    name: frontend-dashboard (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json
      - name: Install
        working-directory: frontend-dashboard
        run: npm ci
      - name: Build (tsc --noEmit && vite build)
        working-directory: frontend-dashboard
        run: npm run build
      - name: Test (vitest)
        working-directory: frontend-dashboard
        run: npx vitest run

  mlops:
    name: mlops (ONNX export parity + Triton configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - name: Install (CPU-only torch)
        working-directory: ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r ../mlops-pipeline/requirements-export.txt
      - name: Export models (ONNX where applicable)
        run: python mlops-pipeline/export/export_onnx.py --model all
      - name: Export parity + Triton config validation
        run: python -m pytest -o addopts="" -p no:warnings mlops-pipeline/tests/
      - name: Validate config.pbtxt against the Triton schema
        run: python mlops-pipeline/triton_repo/validate_configs.py
      - name: Verify artifact checksums against the manifest
        run: python mlops-pipeline/export/verify_manifest.py

  manifests:
    name: k8s + helm + prometheus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render raw manifests (kustomize)
        run: |
          kubectl kustomize infra/k8s > /tmp/k8s-rendered.yaml
          wc -l /tmp/k8s-rendered.yaml

      - name: Validate raw manifests
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/k8s-rendered.yaml

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm lint (default, staging, production)
        run: |
          helm lint infra/helm/cloudpso
          helm lint infra/helm/cloudpso -f infra/helm/cloudpso/values-staging.yaml
          helm lint infra/helm/cloudpso -f infra/helm/cloudpso/values-production.yaml
          helm lint infra/helm/cloudpso --set triton.enabled=true,serviceMonitor.enabled=true

      - name: helm template + validate rendered output
        run: |
          helm template cloudpso infra/helm/cloudpso > /tmp/helm-default.yaml
          helm template cloudpso infra/helm/cloudpso -f infra/helm/cloudpso/values-production.yaml > /tmp/helm-prod.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/helm-default.yaml /tmp/helm-prod.yaml

      - name: Validate prometheus config and rules (promtool)
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v2.51.2 check config /p/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus/rules:/p:ro" --entrypoint promtool \
            prom/prometheus:v2.51.2 check rules /p/cloudpso.rules.yml

      - name: Validate compose files
        run: |
          docker compose config >/dev/null
          docker compose -f mlops-pipeline/triton_repo/docker-compose.triton.yml config >/dev/null

  observability:
    name: dashboards + alert rules reference real metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest
      - name: Cross-check dashboards/rules against app metric declarations
        run: python -m pytest -o addopts="" -p no:warnings infra/tests/

  images:
    name: build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [backend-core, ai-engine, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend-core
            context: ./backend-core
          - component: ai-engine
            context: ./ai-engine
          - component: frontend-dashboard
            context: ./frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: cloudpso/${{ matrix.component }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
