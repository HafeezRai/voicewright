[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpso-ai-engine"
version = "0.1.0"
description = "CloudPSO Voice Agent — ai-engine: STT -> NLU -> TTS pipeline (Phase 3)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    # --- AI/ML (declared only; installed when Phase 3 lands the pipeline) ---
    "torch>=2.2,<3.0",
    "transformers>=4.40,<5.0",
    "onnxruntime>=1.17,<2.0",
    # --- audio ---
    "aiortc>=1.9,<2.0",
    "av>=12.0,<14.0",
    "silero-vad>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
