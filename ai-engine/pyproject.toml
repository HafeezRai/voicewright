[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpso-ai-engine"
version = "0.3.0"
description = "CloudPSO Voice Agent — ai-engine: STT -> LLM -> TTS pipeline."
requires-python = ">=3.11,<3.12"
# Kept mirrored with requirements.txt (the Dockerfile installs that file).
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "prometheus-client>=0.20,<1.0",
    # --- HTTP client for the LLM provider (was a dev-only dependency) ---
    "httpx>=0.27,<1.0",
    "grpcio>=1.60,<2.0",
    "numpy>=1.26,<3.0",
    "soundfile>=0.12,<1.0",
    # --- STT ---
    "faster-whisper>=1.0,<2.0",
    # --- TTS (Apache-2.0; piper-tts 1.8 is GPL-3.0-or-later and was rejected) ---
    "sherpa-onnx>=1.10,<2.0",
    # --- knowledge: MiniLM sentence embeddings (retrieval, step 2) ---
    "torch>=2.2,<3.0",
    "transformers>=4.48,<5.0",
    "safetensors>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "grpcio-tools>=1.60,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# app/gen/ is generated by scripts/gen_proto.sh from the shared proto; it is
# committed so the service builds without grpcio-tools, but it is not ours to
# lint or reformat.
extend-exclude = ["app/gen"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, UP = pyupgrade, B = bugbear,
# RUF = ruff-specific. Deliberately excludes rules that fight the deliberate
# broad `except Exception` guards that convert backend failures into HTTP 503
# and skip-with-reason test paths (see BLE001/S110 below).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    "BLE001", # broad except: intentional at the API and test-skip boundaries
    "B017",   # pytest.raises(Exception): pre-existing Phase 1 assertions
    "S110",   # try/except/pass: intentional in the device-detection probe
    "B027",   # load()/close() are deliberate optional no-op hooks on the engines,
              # not abstract members: callers may skip them, and not every
              # backend has anything to release.
]
