# Minimal static-file server for the built Vite bundle.
# Listens on 5173 so the compose mapping (5173:5173) lines up.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
