# Voicewright Voice Agent — Phase 1 local stack.
# Skeleton only: services build and expose health endpoints; no pipeline logic.
# All values are .env-driven with sane defaults (no secrets committed).

name: voicewright

services:
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    image: voicewright/backend-core:dev
    # Values come from `.env` (auto-loaded by compose for interpolation) with
    # defaults below. No env_file directive: it would hard-fail when `.env` is
    # absent, and every variable it would carry is enumerated explicitly here.
    environment:
      VOICEWRIGHT_ENV: ${VOICEWRIGHT_ENV:-development}
      VOICEWRIGHT_LOG_LEVEL: ${VOICEWRIGHT_LOG_LEVEL:-INFO}
      VOICEWRIGHT_CONFIG_PREFIX: ${VOICEWRIGHT_CONFIG_PREFIX:-voicewright}
      BACKEND_CORE_HOST: ${BACKEND_CORE_HOST:-0.0.0.0}
      # Container-internal bind ports are fixed; the host-published ports below
      # are what BACKEND_CORE_PORT / BACKEND_CORE_GRPC_PORT configure.
      BACKEND_CORE_PORT: "8000"
      BACKEND_CORE_GRPC_PORT: "50051"
      # How backend-core reaches ai-engine inside the compose network.
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8001}
      # Phase 4: browser origins allowed to call the HTTP API (CORS).
      VOICEWRIGHT_CORS_ALLOW_ORIGINS: ${VOICEWRIGHT_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_CORE_PORT:-8000}:8000"
      - "${BACKEND_CORE_GRPC_PORT:-50051}:50051"
    depends_on:
      ai-engine:
        condition: service_healthy
    networks:
      - voicewright-net
    restart: unless-stopped

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: voicewright/ai-engine:dev
    environment:
      VOICEWRIGHT_ENV: ${VOICEWRIGHT_ENV:-development}
      VOICEWRIGHT_LOG_LEVEL: ${VOICEWRIGHT_LOG_LEVEL:-INFO}
      VOICEWRIGHT_CONFIG_PREFIX: ${VOICEWRIGHT_CONFIG_PREFIX:-voicewright}
      AI_ENGINE_HOST: ${AI_ENGINE_HOST:-0.0.0.0}
      # Fixed in-container bind port; AI_ENGINE_PORT in .env sets the host port.
      AI_ENGINE_PORT: "8001"
      AI_ENGINE_MODEL_CACHE: ${AI_ENGINE_MODEL_CACHE:-/models}
      # Phase 3: pipeline backends and the gRPC VoiceGateway port.
      AI_ENGINE_DEVICE: ${AI_ENGINE_DEVICE:-cpu}
      # The think stage: an OpenAI-compatible LLM, a local Ollama by default.
      # Inside compose the *host's* Ollama is reachable at host.docker.internal,
      # NOT 127.0.0.1 -- that is the container's own loopback, where no Ollama is
      # listening. Docker Desktop resolves host.docker.internal for you; on Linux
      # add `extra_hosts: ["host.docker.internal:host-gateway"]` to this service.
      AI_ENGINE_LLM_PROVIDER: ${AI_ENGINE_LLM_PROVIDER:-ollama}
      AI_ENGINE_LLM_BASE_URL: ${AI_ENGINE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_ENGINE_LLM_MODEL: ${AI_ENGINE_LLM_MODEL:-llama3:8b}
      AI_ENGINE_EMBEDDING_MODEL: ${AI_ENGINE_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      AI_ENGINE_STT_MODEL: ${AI_ENGINE_STT_MODEL:-base.en}
      AI_ENGINE_TTS_MODEL: ${AI_ENGINE_TTS_MODEL:-vits-piper-en_US-amy-low}
      AI_ENGINE_GRPC_ENABLED: ${AI_ENGINE_GRPC_ENABLED:-true}
      AI_ENGINE_GRPC_PORT: "50052"
      # Phase 4: browser origins allowed to call the HTTP API (CORS).
      VOICEWRIGHT_CORS_ALLOW_ORIGINS: ${VOICEWRIGHT_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${AI_ENGINE_PORT:-8001}:8001"
      - "${AI_ENGINE_GRPC_PORT:-50052}:50052"
    volumes:
      # Named volume keeps downloaded weights out of the git tree.
      - ai-engine-models:${AI_ENGINE_MODEL_CACHE:-/models}
    networks:
      - voicewright-net
    restart: unless-stopped

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
      # VITE_* are baked into the bundle at build time, so they must be build
      # args — a runtime `environment:` entry would never reach the static files.
      args:
        VITE_BACKEND_CORE_URL: ${VITE_BACKEND_CORE_URL:-http://localhost:8000}
        VITE_AI_ENGINE_URL: ${VITE_AI_ENGINE_URL:-http://localhost:8001}
    image: voicewright/frontend-dashboard:dev
    environment:
      VITE_BACKEND_CORE_URL: ${VITE_BACKEND_CORE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_DASHBOARD_PORT:-5173}:5173"
    depends_on:
      - backend-core
    networks:
      - voicewright-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Phase 5: alerting/recording rules. Required — prometheus.yml declares a
      # rule_files glob, and Prometheus refuses to start if it matches nothing.
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - voicewright-net
    restart: unless-stopped

networks:
  voicewright-net:
    driver: bridge

volumes:
  ai-engine-models:
  prometheus-data:
