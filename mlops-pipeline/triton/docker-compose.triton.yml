# Triton Inference Server for the CloudPSO ai-engine models.
#
# NOT RUN by this repository's verification: the verify host is arm64 macOS with
# no NVIDIA GPU, so the nvcr.io Triton image cannot start (it requires the
# NVIDIA container runtime and a CUDA device). This file documents the intended
# deployment and is validated only to the extent that `docker compose config`
# parses it. See mlops-pipeline/README.md, section "Validated vs executed".
#
# Run it on a GPU host:
#
#   python mlops-pipeline/export/export_onnx.py --model all
#   python mlops-pipeline/export/populate_triton_repo.py
#   docker compose -f mlops-pipeline/triton/docker-compose.triton.yml up
#
# Then point ai-engine at it (the client wiring is a Phase 5 follow-up, not done
# here -- the ai-engine still calls in-process engines).
#
# Equivalent single-container command:
#
#   docker run --rm --gpus all --shm-size=1g \
#     -p 8000:8000 -p 8001:8001 -p 8002:8002 \
#     -v "$PWD/mlops-pipeline/triton/model_repository:/models:ro" \
#     -v "$PWD/ai-engine/models/tts:/models/tts:ro" \
#     nvcr.io/nvidia/tritonserver:24.08-py3 \
#     tritonserver --model-repository=/models --strict-model-config=true

services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command:
      - tritonserver
      - --model-repository=/models
      # Fail loudly on a bad config instead of leaving the model UNAVAILABLE
      # with no error -- the failure mode that makes config typos expensive.
      - --strict-model-config=true
      - --log-verbose=1
    ports:
      - "8000:8000"   # HTTP  (KServe / v2 inference)
      - "8001:8001"   # gRPC
      - "8002:8002"   # Prometheus metrics -- scraped by infra/prometheus
    volumes:
      - ./model_repository:/models:ro
      # TTS voices live with the ai-engine cache; staged here read-only.
      - ../../ai-engine/models/tts:/models/tts:ro
    shm_size: "1g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Prometheus in this stack, scraping Triton's /metrics (port 8002) plus the
  # two application services. Reuses the repo-wide scrape config.
  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped
