{{- if and .Values.backendCore.enabled .Values.backendCore.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudpso.fullname" . }}-backend-core
  labels:
    {{- include "cloudpso.componentLabels" (dict "ctx" $ "component" "backend-core") | nindent 4 }}
spec:
  minAvailable: {{ .Values.backendCore.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cloudpso.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-core
{{- end }}
