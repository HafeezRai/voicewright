{{- if .Values.backendCore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudpso.fullname" . }}-backend-core
  labels:
    {{- include "cloudpso.componentLabels" (dict "ctx" $ "component" "backend-core") | nindent 4 }}
spec:
  {{- if not .Values.backendCore.autoscaling.enabled }}
  replicas: {{ .Values.backendCore.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudpso.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "cloudpso.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-core
      {{- with .Values.backendCore.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "cloudpso.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.backendCore.terminationGracePeriodSeconds }}
      containers:
        - name: backend-core
          image: "{{ .Values.backendCore.image.repository }}:{{ .Values.backendCore.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backendCore.service.port }}
            - name: grpc
              containerPort: {{ .Values.backendCore.service.grpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "cloudpso.fullname" . }}-config
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudpso.secretName" . }}
                  key: TURN_SHARED_SECRET
                  optional: true
          resources:
            {{- toYaml .Values.backendCore.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpso.fullname" . }}-backend-core
  labels:
    {{- include "cloudpso.componentLabels" (dict "ctx" $ "component" "backend-core") | nindent 4 }}
spec:
  type: {{ .Values.backendCore.service.type }}
  selector:
    {{- include "cloudpso.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend-core
  ports:
    - name: http
      port: {{ .Values.backendCore.service.port }}
      targetPort: http
    - name: grpc
      port: {{ .Values.backendCore.service.grpcPort }}
      targetPort: grpc
{{- end }}
