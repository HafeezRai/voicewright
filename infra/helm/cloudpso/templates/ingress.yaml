{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cloudpso.fullname" . }}
  labels:
    {{- include "cloudpso.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudpso.fullname" . }}-frontend-dashboard
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
          {{- if .Values.backendCore.enabled }}
          - path: /api/backend
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudpso.fullname" . }}-backend-core
                port:
                  number: {{ .Values.backendCore.service.port }}
          {{- end }}
          {{- if .Values.aiEngine.enabled }}
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudpso.fullname" . }}-ai-engine
                port:
                  number: {{ .Values.aiEngine.service.port }}
          {{- end }}
{{- end }}
