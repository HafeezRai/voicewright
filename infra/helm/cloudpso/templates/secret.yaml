{{- /*
  A Secret is created ONLY when secrets.create is true. The default is false:
  credentials belong in an external secret store, and rendering a Secret from
  values.yaml puts them in `helm get values` output and in the release history.
  When create is false, the Deployments reference secrets.existingSecret.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudpso.secretName" . }}
  labels:
    {{- include "cloudpso.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete credentials on uninstall
type: Opaque
stringData:
  HUGGING_FACE_HUB_TOKEN: {{ .Values.secrets.huggingFaceToken | quote }}
  TURN_SHARED_SECRET: {{ .Values.secrets.turnSharedSecret | quote }}
{{- end }}
