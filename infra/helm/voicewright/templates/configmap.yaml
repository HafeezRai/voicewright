apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voicewright.fullname" . }}-config
  labels:
    {{- include "voicewright.labels" . | nindent 4 }}
data:
  # Values shared by every component and the per-component blocks below mirror
  # the variables docker-compose.yml sets for the same images.
  VOICEWRIGHT_ENV: {{ .Values.global.environment | quote }}
  VOICEWRIGHT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  VOICEWRIGHT_CONFIG_PREFIX: {{ .Values.config.configPrefix | quote }}
  VOICEWRIGHT_CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}

  {{- if .Values.backendCore.enabled }}
  BACKEND_CORE_HOST: "0.0.0.0"
  BACKEND_CORE_PORT: {{ .Values.backendCore.service.port | quote }}
  BACKEND_CORE_GRPC_PORT: {{ .Values.backendCore.service.grpcPort | quote }}
  AI_ENGINE_URL: "http://{{ include "voicewright.fullname" . }}-ai-engine:{{ .Values.aiEngine.service.port }}"
  {{- end }}

  {{- if .Values.aiEngine.enabled }}
  AI_ENGINE_HOST: "0.0.0.0"
  AI_ENGINE_PORT: {{ .Values.aiEngine.service.port | quote }}
  AI_ENGINE_GRPC_PORT: {{ .Values.aiEngine.service.grpcPort | quote }}
  AI_ENGINE_GRPC_ENABLED: "true"
  AI_ENGINE_MODEL_CACHE: "/models"
  AI_ENGINE_LAZY_MODELS: "true"
  AI_ENGINE_DEVICE: "cpu"
  # The think stage: a generative LLM replaces the old intent classifier. Point
  # AI_ENGINE_LLM_BASE_URL at an in-cluster or external OpenAI-compatible
  # endpoint. host.docker.internal is a Docker Desktop convenience and does NOT
  # resolve inside a cluster.
  AI_ENGINE_LLM_PROVIDER: "ollama"
  AI_ENGINE_LLM_BASE_URL: "http://ollama:11434/v1"
  AI_ENGINE_LLM_MODEL: "llama3:8b"
  AI_ENGINE_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  AI_ENGINE_STT_MODEL: "base.en"
  AI_ENGINE_TTS_MODEL: "vits-piper-en_US-amy-low"
  {{- end }}
