# Prometheus alerting + recording rules for the Voicewright Voice Agent.
#
# Every metric referenced here is declared in backend-core/app/metrics.py or
# ai-engine/app/metrics.py -- no invented series. Names match the emitters:
#
#   voicewright_active_webrtc_sessions            gauge
#   voicewright_webrtc_sessions_total             counter
#   voicewright_bargein_events_total              counter
#   voicewright_vad_frames_processed_total        counter{backend,speech}
#   voicewright_signaling_connections             gauge
#   voicewright_ai_stt_requests_total             counter{status}
#   voicewright_ai_stt_latency_seconds            histogram
#   voicewright_ai_stt_audio_seconds              histogram
#   voicewright_ai_llm_requests_total             counter{provider,status}
#   voicewright_ai_llm_latency_seconds            histogram{provider}
#   voicewright_ai_llm_first_token_seconds        histogram{provider}
#   voicewright_ai_llm_tokens_total               counter{provider,kind}
#   voicewright_ai_llm_cancelled_total            counter{provider}
#   voicewright_ai_tts_requests_total             counter{status}
#   voicewright_ai_tts_latency_seconds            histogram
#   voicewright_ai_tts_cancelled_total            counter
#   voicewright_ai_pipeline_requests_total        counter{status,llm_provider}
#   voicewright_ai_pipeline_latency_seconds       histogram
#   voicewright_ai_grpc_audio_frames_total        counter
#   voicewright_ai_grpc_events_total              counter{kind}
groups:
  # --- recording rules ------------------------------------------------------
  # Pre-compute the latency quantiles the dashboards and alerts both want, so
  # the (relatively expensive) histogram_quantile runs once per rule interval
  # rather than once per panel per refresh.
  - name: voicewright.latency
    interval: 15s
    rules:
      - record: voicewright:stt_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(voicewright_ai_stt_latency_seconds_bucket[5m])))
      - record: voicewright:llm_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(voicewright_ai_llm_latency_seconds_bucket[5m])))
      # First-token latency, pre-computed like the rest: it is the metric whose
      # regression means "the agent feels broken" (see VoicewrightLLMFirstTokenHighLatency).
      - record: voicewright:llm_first_token_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(voicewright_ai_llm_first_token_seconds_bucket[5m])))
      - record: voicewright:tts_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(voicewright_ai_tts_latency_seconds_bucket[5m])))
      - record: voicewright:pipeline_latency_p95_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(voicewright_ai_pipeline_latency_seconds_bucket[5m])))

  - name: voicewright.throughput
    interval: 30s
    rules:
      # Audio seconds per second, not requests per second: a rate over audio
      # duration is the honest measure of STT/TTS load.
      - record: voicewright:stt_audio_seconds_rate
        expr: sum(rate(voicewright_ai_stt_audio_seconds_sum[5m])) / sum(rate(voicewright_ai_stt_audio_seconds_count[5m]))
      - record: voicewright:tts_audio_seconds_rate
        expr: sum(rate(voicewright_ai_tts_audio_seconds_sum[5m])) / sum(rate(voicewright_ai_tts_audio_seconds_count[5m]))

  - name: voicewright.errors
    interval: 30s
    rules:
      - record: voicewright:stt_error_ratio
        expr: |
          sum(rate(voicewright_ai_stt_requests_total{status!="ok"}[5m]))
            / clamp_min(sum(rate(voicewright_ai_stt_requests_total[5m])), 1e-9)
      - record: voicewright:pipeline_error_ratio
        expr: |
          sum(rate(voicewright_ai_pipeline_requests_total{status!="ok"}[5m]))
            / clamp_min(sum(rate(voicewright_ai_pipeline_requests_total[5m])), 1e-9)

  # --- alerts ---------------------------------------------------------------
  - name: voicewright.alerts
    rules:
      - alert: VoicewrightServiceDown
        expr: up{job=~"backend-core|ai-engine"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not scrapeable"
          description: >-
            Prometheus has failed to scrape {{ $labels.job }} for 2 minutes.
            Either the service is down or /metrics is unreachable.

      - alert: VoicewrightPipelineHighLatency
        # The whole point of the system is an interactive turn. The old 1.5 s
        # budget was set when the middle stage was a ~30 ms intent classifier;
        # the stage is now a generative LLM, and a local llama3:8b turn is
        # seconds, not milliseconds. 6 s p95 is the "something is genuinely
        # wrong" line, and the LLM is almost always the dominant stage when it
        # trips -- STT and TTS both stay well under a second.
        expr: voicewright:pipeline_latency_p95_seconds > 6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Voice pipeline p95 latency above 6 s"
          description: >-
            p95 full-turn latency is {{ $value | humanizeDuration }} over the
            last 5 minutes. The LLM stage dominates the budget -- check
            voicewright:llm_latency_p95_seconds first, then stt/tts.

      - alert: VoicewrightLLMFirstTokenHighLatency
        # First-token latency is the metric whose regression actually means "the
        # agent feels broken": total latency can be healthy while the user sits
        # in dead air waiting for the reply to start. A cold local llama3:8b load
        # is a handful of seconds; sustained first-token p95 above 3 s means the
        # model is reloading on every turn (keep_alive / warm-up broken) or the
        # endpoint is slow -- not merely that it is chatty.
        expr: voicewright:llm_first_token_p95_seconds > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM first-token p95 above 3 s"
          description: >-
            p95 time from request to the first streamed token is
            {{ $value | humanizeDuration }} over the last 5 minutes. That is
            dead air before the agent begins to speak -- usually a model being
            reloaded every turn rather than a slow model.

      - alert: VoicewrightSTTHighErrorRatio
        expr: voicewright:stt_error_ratio > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "STT error ratio above 5%"
          description: "{{ $value | humanizePercentage }} of STT requests are failing."

      - alert: VoicewrightPipelineHighErrorRatio
        expr: voicewright:pipeline_error_ratio > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Full-pipeline error ratio above 5%"
          description: "{{ $value | humanizePercentage }} of pipeline turns are failing."

      - alert: VoicewrightNoActiveSessions
        # A production voice gateway with zero sessions for 30 minutes is far
        # more likely to be broken than genuinely idle.
        expr: sum(voicewright_active_webrtc_sessions) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No active WebRTC sessions for 30 minutes"
          description: >-
            Either there is no traffic or the gateway can no longer accept
            sessions. Confirm with voicewright_webrtc_sessions_total (has it moved?)
            and voicewright_signaling_connections.

      - alert: VoicewrightSignalingChurn
        # Sessions appearing without signalling connections (or vice versa)
        # points at a leak or a half-open WebSocket.
        expr: sum(voicewright_signaling_connections) == 0 and sum(voicewright_active_webrtc_sessions) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active sessions with no signalling connections"
          description: >-
            {{ $value }} sessions are open but no WebSocket signalling
            connections are registered -- check for leaked or half-open sockets.

      - alert: VoicewrightHighBargeInRate
        # Barge-in is a feature, but a rate this high usually means TTS is
        # talking over the user (bad turn detection) rather than users genuinely
        # interrupting.
        expr: |
          sum(rate(voicewright_bargein_events_total[10m]))
            / clamp_min(sum(rate(voicewright_ai_pipeline_requests_total[10m])), 1e-9) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Barge-in rate above 50% of turns"
          description: >-
            More than half of turns are being interrupted. Verify the VAD
            thresholds and that the agent is not mis-timing its replies.

      - alert: VoicewrightVADBackendDegraded
        # backend-core falls back to the energy VAD if the Silero ONNX model is
        # unavailable; that is a silent quality regression unless it is alerted.
        expr: sum(rate(voicewright_vad_frames_processed_total{backend="energy"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VAD is running the energy fallback, not Silero"
          description: >-
            Frames are being classified by the energy backend, which means the
            Silero ONNX model failed to load. Speech detection quality is
            degraded.
