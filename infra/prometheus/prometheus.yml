# Voicewright Voice Agent — Prometheus scrape config.
#
# Phase 1 created this file with backend-core + ai-engine jobs; Phase 5 adds the
# alerting/recording rules (rules/voicewright.rules.yml) and an optional Triton job.
#
# Mounted read-only into the `prometheus` compose service at
# /etc/prometheus/prometheus.yml (see docker-compose.yml). The rules directory
# must be mounted too -- Prometheus refuses to start if a rule_files glob matches
# nothing on a specified path, and docker-compose.yml mounts it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: voicewright-local
    env: development

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus scraping itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # backend-core — WebRTC gateway / WebSocket / barge-in metrics.
  # Series: voicewright_active_webrtc_sessions, voicewright_webrtc_sessions_total,
  # voicewright_bargein_events_total, voicewright_vad_frames_processed_total,
  # voicewright_signaling_connections. Served by the app itself at /metrics.
  - job_name: backend-core
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-core:8000"]
        labels:
          service: backend-core

  # ai-engine — STT/LLM/TTS latency and throughput metrics.
  # Series: voicewright_ai_* (see ai-engine/app/metrics.py).
  - job_name: ai-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-engine:8001"]
        labels:
          service: ai-engine

  # Triton inference server (OPTIONAL — only when the GPU serving path is up; see
  # mlops-pipeline/triton_repo/docker-compose.triton.yml). Down by default in the local
  # stack, which surfaces as `up{job="triton"} == 0` rather than an error, and is
  # excluded from VoicewrightServiceDown. Triton's own metrics are not voicewright_*;
  # no alert in rules/ depends on them.
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
        labels:
          service: triton
