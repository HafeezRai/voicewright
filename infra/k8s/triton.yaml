# Triton Inference Server (OPTIONAL).
#
# This is the GPU serving path for the ONNX/CTranslate2 artifacts in
# mlops-pipeline/triton_repo/model_repository. It is deployed to a node pool with
# GPUs; the ai-engine's in-process engines remain the default path, so this
# workload can be omitted entirely (delete this file from kustomization.yaml)
# without breaking the stack.
#
# The model repository is served from an RWX PVC populated out-of-band by
#   mlops-pipeline/export/populate_triton_repo.py
# (the weights are staged there, not baked into the image).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-models
  namespace: voicewright
  labels:
    app.kubernetes.io/name: triton
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: voicewright
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/part-of: voicewright-voice-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton
      annotations:
        # Triton exposes Prometheus metrics on its own port; the scrape config
        # in infra/prometheus has a matching `triton` job.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      # Triton runs as root in the NVIDIA image by default; the container also
      # needs the GPU device plugin, so no restrictive pod securityContext here.
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.08-py3
          args:
            - tritonserver
            - --model-repository=/models
            # Reject a bad config at startup rather than leaving the model
            # UNAVAILABLE with no error (Triton's default, silent behaviour).
            - --strict-model-config=true
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "8Gi"
              cpu: "2"
            requests:
              memory: "4Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 60      # model load (esp. 1.6 GiB) takes a while
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
            # VITS shared memory: Triton needs a large /dev/shm for the
            # ONNX/IPC path or it fails at load.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: triton-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: voicewright
  labels:
    app.kubernetes.io/name: triton
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
