# TEMPLATE ONLY -- contains no real credentials and must never carry any.
#
# This file exists so the Deployments' `secretKeyRef` entries have a documented
# contract. In a real cluster the Secret is produced by an external secret
# manager (External Secrets Operator, SOPS, Vault CSI, Sealed Secrets) -- not by
# `kubectl apply -f` on a file in git.
#
# Do NOT commit a filled-in copy. The `.gitignore` excludes `.env*`; keep any
# real secret material in the same category.
#
# To use this template locally:
#   kubectl -n cloudpso create secret generic cloudpso-secrets \
#     --from-literal=HUGGING_FACE_HUB_TOKEN="$(pass show hf/token)" \
#     --from-literal=TURN_SHARED_SECRET="$(openssl rand -hex 32)"
#
# The keys below are referenced by name from the Deployments.
apiVersion: v1
kind: Secret
metadata:
  name: cloudpso-secrets
  namespace: cloudpso
  labels:
    app.kubernetes.io/part-of: cloudpso-voice-agent
type: Opaque
stringData:
  # Token for private/gated HuggingFace checkpoints (Whisper). Public models
  # need no token, so this may legitimately be empty.
  HUGGING_FACE_HUB_TOKEN: ""
  # Shared secret for the TURN/STUN relay used by WebRTC when peers cannot
  # reach each other directly. Unused by the local compose stack.
  TURN_SHARED_SECRET: ""
