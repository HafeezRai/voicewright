# frontend-dashboard: static Vite bundle served by nginx on port 5173.
#
# The VITE_* endpoints are baked into the bundle at *image build* time, so they
# are build args in the Dockerfile, not runtime env. The ingress below is the
# supported way to change the URLs a deployment serves: rebuild the image with
# new build args (done by CI), don't patch the running pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: cloudpso
  labels:
    app.kubernetes.io/name: frontend-dashboard
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cloudpso-voice-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx user in nginx:alpine
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-dashboard
          image: cloudpso/frontend-dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx:alpine binds 5173 (unprivileged) so no NET_BIND_SERVICE
              # is needed -- a deliberate choice from Phase 4's nginx.conf.
            readOnlyRootFilesystem: false   # nginx writes its pid/cache files
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-dashboard
  namespace: cloudpso
  labels:
    app.kubernetes.io/name: frontend-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend-dashboard
  ports:
    - name: http
      port: 5173
      targetPort: http
